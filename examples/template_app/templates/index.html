<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>{{ title }}</title>
    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>
<body>
    <main class="container">
        <h1>{{ title }}</h1>

        <p>Select a dynamically rendered profile:</p>

        <ul class="user-list">
            {% for user in users %}
            <li>
                <a href="/users/{{ user.username }}">
                    {{ user.name }}
                </a>
            </li>
            {% endfor %}
        </ul>
    </main>
</body>
</html>
